name: Autobuild

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Get CMake
      uses: symbitic/install-cmake@master
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        host: 'linux'
        target: 'desktop'
    - name: goto build dir
      run: mkdir build && cd build
    - name: cmake configure
      run: cmake ..
    - name: make
      run: make
    - name: exit build dir
      run: cd ..
